name: CI

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.12"]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
          python -m pip install -e .

      - name: Verify module entrypoint
        run: python -m airesearch --help

      - name: Verify console script
        run: >-
          python -c "import pathlib, shutil, subprocess, sys, sysconfig; suffix = '.exe' if sys.platform.startswith('win') else ''; exe = shutil.which('airesearch') or str(pathlib.Path(sysconfig.get_path('scripts')) / f'airesearch{suffix}'); raise SystemExit(subprocess.run([exe, '--help'], check=False).returncode)"

      - name: Run tests
        run: python -m pytest -q
